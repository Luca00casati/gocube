name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache the engine build (godot-cpp takes ~8 minutes to compile)
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ hashFiles('.gitmodules', 'engine/SConstruct') }}-${{ hashFiles('engine/src/**') }}
          restore-keys: |
            scons-${{ hashFiles('.gitmodules', 'engine/SConstruct') }}-

      - name: Build the engine for Linux and Windows (SCons; Windows cross-compiled with MinGW)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          sudo apt-get update -q && sudo apt-get install -yq scons g++-mingw-w64-x86-64
          scons -C engine -j"$(nproc)"
          scons -C engine platform=windows use_mingw=yes -j"$(nproc)"

      - name: Download Godot ${{ env.GODOT_VERSION }} (checksum-verified)
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          curl -fsSLO "$base/$zip"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          ./godot --version

      - name: Import the project
        # The headless import has crashed intermittently on a fresh cache; retry.
        run: |
          for attempt in 1 2 3; do
            ./godot --headless --import && exit 0
            echo "import attempt $attempt failed, retrying"
          done
          exit 1

      - name: Tests (multiplayer across two processes and the packages included)
        run: python3 tests/run_tests.py --godot=./godot

      - name: Package the game (official Godot + the project folder; Windows' Godot is downloaded and checked)
        run: |
          python3 tools/package.py dist/linux --godot=godot
          python3 tools/package.py dist/windows --platform=windows
          tar -C dist/linux -czf GoCube-linux-x86_64.tar.gz GoCube
          (cd dist/windows && zip -qr ../../GoCube-windows-x86_64.zip GoCube)

      - name: Upload the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: GoCube-linux-x86_64
          path: GoCube-linux-x86_64.tar.gz

      - name: Upload the Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GoCube-windows-x86_64
          path: GoCube-windows-x86_64.zip
